<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои проекты</title>
<style>
  /* ЦВЕТА: светлая и тёмная тема подстраиваются под устройство */
  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --text: #1d2130;
    --muted: #6b7185;
    --accent: #4f6bff;
    --border: #e1e4ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c;
      --card: #1c202c;
      --text: #eef0f7;
      --muted: #9aa1b8;
      --accent: #8195ff;
      --border: #2b3040;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header { max-width: 900px; margin: 0 auto 28px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  header p { margin: 0; color: var(--muted); }

  /* Сетка кнопок: сама перестраивается под ширину экрана */
  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
  }

  /* Одна кнопка-карточка */
  .card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: inherit;
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card .icon { font-size: 34px; }
  .card .name { font-weight: 600; font-size: 18px; }
  .card .desc { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>Мои проекты</h1>
  <p>Выберите, что открыть</p>
</header>

<main class="grid">


  <a class="card" href="https://1matea.github.io/imatea/calc.html">
    <span class="icon">🧮</span>
    <span class="name">Калькулятор</span>
    <span class="desc">Быстрые расчёты</span>
  </a>

  <a class="card" href="https://1matea.github.io/imatea/noise.html">
    <span class="icon">🎤</span>
    <span class="name">Шумомер</span>
    <span class="desc">Измерение уровня шума</span>
  </a>

   <a class="card" href="https://1matea.github.io/imatea/graph.html">
    <span class="icon">y=2x</span>
    <span class="name">Графический калькулятор</span>
    <span class="desc">Построение графиков функций</span>
  </a>

  <!-- НОВЫЕ КНОПКИ ДОБАВЛЯЙТЕ НИЖЕ ЭТОЙ СТРОКИ -->

</main>

</body>
</html>
