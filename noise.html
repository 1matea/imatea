<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шумомер</title>
<style>
:root{--board:#1d3a2f;--board2:#162d24;--chalk:#f1efe6;--dim:#a9bfb2;--ok:#9be39f;--mid:#ecd98a;--bad:#f0735f;--state:var(--ok);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--board2)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,var(--board),var(--board2));color:var(--chalk);
font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:1000px;padding:20px 16px 32px;display:grid;gap:20px;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
@media (max-width:760px){main{grid-template-columns:1fr}}
.face{position:relative;border-radius:10px;overflow:hidden;border:3px solid var(--state);transition:border-color .25s;background:#000;aspect-ratio:864/1224;max-height:78vh;margin:0 auto;width:100%}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.face img.on{opacity:1}
.panel{display:grid;gap:18px}
h1{margin:0;font-size:1.3rem;font-weight:600;color:var(--dim)}
.read{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
.db{font-size:clamp(4rem,12vw,7rem);line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--state);transition:color .25s}
.db small{font-size:.3em;font-weight:400;color:var(--dim);margin-left:6px}
.pct{font-size:clamp(1.8rem,5vw,2.6rem);font-variant-numeric:tabular-nums}
.status{font-size:1.15rem;min-height:1.5em}
.bar{position:relative;height:30px;border-radius:6px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--state);transition:background .25s}
.mark{position:absolute;top:0;bottom:0;width:2px;background:var(--chalk);opacity:.9}
.scale{display:flex;justify-content:space-between;color:var(--dim);font-size:.8rem;margin-top:4px;font-variant-numeric:tabular-nums}
.set{display:grid;gap:14px;padding:16px;border:1px dashed rgba(241,239,230,.4);border-radius:8px}
.row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center}
.row output{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.row{grid-template-columns:1fr 60px}.row label{grid-column:1/-1}}
input[type=range]{width:100%;accent-color:var(--chalk);min-height:28px}
button{font:inherit;padding:12px 20px;border-radius:8px;border:2px solid var(--chalk);background:transparent;color:var(--chalk);cursor:pointer}
button:hover{background:rgba(255,255,255,.1)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.err{color:var(--bad);min-height:1.3em}
.hint{color:var(--dim);font-size:.85rem;margin:0}
</style>
</head>

<script>
(function(){
 var MIN=30, MAX=100;
 var $=function(id){return document.getElementById(id)};
 var t1=$('t1'),t2=$('t2'),cal=$('cal');
 var imgs={ok:$('i-ok'),mid:$('i-mid'),bad:$('i-bad')};
 var level=-120, shown=0, state='', ctx, analyser, buf, raf;

 function load(){try{['t1','t2','cal'].forEach(function(k){var v=localStorage.getItem('sm_'+k);if(v!==null)$(k).value=v;});}catch(e){}}
 function save(){try{['t1','t2','cal'].forEach(function(k){localStorage.setItem('sm_'+k,$(k).value);});}catch(e){}}
 function pos(v){return Math.max(0,Math.min(100,(v-MIN)/(MAX-MIN)*100));}
 function ui(changed){
  var a=+t1.value,b=+t2.value;
  if(changed==='t1'&&a>b){t2.value=a;b=a;}
  if(changed==='t2'&&b<a){t1.value=b;a=b;}
  $('t1o').textContent=a+' дБ';$('t2o').textContent=b+' дБ';$('calo').textContent=cal.value;
  $('m1').style.left=pos(a)+'%';$('m2').style.left=pos(b)+'%';
  save();
 }
 [t1,t2,cal].forEach(function(el){el.addEventListener('input',function(){ui(el.id)});});

 function setState(s){
  if(s===state)return; state=s;
  for(var k in imgs)imgs[k].classList.toggle('on',k===s);
  var c={ok:'--ok',mid:'--mid',bad:'--bad'}[s];
  document.documentElement.style.setProperty('--state','var('+c+')');
  $('status').textContent={ok:'Тихо',mid:'Шумновато',bad:'Слишком громко!'}[s];
 }

 function tick(){
  analyser.getFloatTimeDomainData(buf);
  var sum=0;for(var i=0;i<buf.length;i++)sum+=buf[i]*buf[i];
  var rms=Math.sqrt(sum/buf.length);
  var dbfs=20*Math.log10(Math.max(rms,1e-7));
  var db=dbfs+ +cal.value;           // оценка уровня в дБ
  level = db>level ? level+(db-level)*0.5 : level+(db-level)*0.08; // быстрая атака, плавный спад
  var d=Math.max(0,level);
  shown=Math.round(d);
  $('db').textContent=shown;
  var p=pos(d);
  $('pct').textContent=Math.round(p);
  $('fill').style.width=p+'%';
  setState(d<+t1.value?'ok':(d<+t2.value?'mid':'bad'));
  raf=requestAnimationFrame(tick);
 }

 $('start').addEventListener('click',async function(){
  $('err').textContent='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('err').textContent='Браузер не поддерживает доступ к микрофону (нужен HTTPS).';return;}
  try{
   var stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
   if(ctx){ctx.close();cancelAnimationFrame(raf);}
   ctx=new (window.AudioContext||window.webkitAudioContext)();
   await ctx.resume();
   var src=ctx.createMediaStreamSource(stream);
   analyser=ctx.createAnalyser();analyser.fftSize=2048;
   buf=new Float32Array(analyser.fftSize);
   src.connect(analyser);
   $('start').textContent='Микрофон включён';
   tick();
  }catch(e){
   $('err').textContent=(e&&e.name==='NotAllowedError')?'Доступ к микрофону запрещён. Разрешите его в настройках браузера и нажмите кнопку снова.':'Не удалось включить микрофон: '+(e&&e.message||e);
  }
 });
 load();ui();setState('ok');
})();
</script>
